[package]
name = "cli-game"
version = "1.0.0"
edition = "2024"
description = "확장 가능한 TUI CLI 게임"
license = "MIT"

[[bin]]
name = "tcade"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.13"
