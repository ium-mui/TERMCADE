name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    env:
      RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish-only.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish-only.outputs.tag_name }}
    steps:
      - name: Update the release pull request or create a release
        id: release
        if: env.RELEASE_TOKEN_CONFIGURED == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Publish a merged release without opening release pull requests
        id: publish-only
        if: env.RELEASE_TOKEN_CONFIGURED != 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: tcade
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tcade
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: tcade
            archive: tar
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: tcade
            archive: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: tcade.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          package="termcade-${TAG_NAME}-${TARGET}"
          mkdir -p dist "${package}"
          cp "target/${TARGET}/release/${BINARY}" "${package}/"
          cp README.md LICENSE "${package}/"
          tar -czf "dist/${package}.tar.gz" "${package}"
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          $package = "termcade-$env:TAG_NAME-$env:TARGET"
          New-Item -ItemType Directory -Force -Path dist, $package
          Copy-Item "target/$env:TARGET/release/$env:BINARY" $package
          Copy-Item README.md, LICENSE $package
          Compress-Archive -Path $package -DestinationPath "dist/$package.zip"
      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: termcade-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-assets:
    name: Publish release assets
    needs:
      - release
      - build
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: termcade-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum termcade-* > SHA256SUMS
      - name: Attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
