name: Support request
description: Ask a focused question about using or developing TERMCADE.
title: "support: "
labels:
  - support
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands and sanitized output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: TERMCADE version, OS, terminal, and Rust version
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This request does not disclose a security vulnerability or sensitive data.
          required: true
