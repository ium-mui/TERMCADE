name: Bug report
description: Report a reproducible problem in TERMCADE.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TERMCADE. Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: TERMCADE version
      description: Run `tcade --version` or provide the commit SHA.
      placeholder: v1.0.0 or 0123abc
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Include the terminal application and `$TERM` value when available.
      placeholder: Windows Terminal, iTerm2, GNOME Terminal, etc.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs or screenshots after removing sensitive information.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
        - label: I removed passwords, tokens, personal data, and other secrets.
          required: true
