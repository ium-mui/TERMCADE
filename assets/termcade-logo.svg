<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">TERMCADE</title>
  <desc id="description">TERMCADE — terminal arcade games</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#15253b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe0d2" />
      <stop offset="1" stop-color="#5baeff" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9bb7d8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#background)" />
  <rect x="12" y="12" width="1176" height="336" rx="24" fill="url(#grid)" stroke="#5baeff" stroke-opacity="0.35" stroke-width="2" />

  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="4">
    <path d="M72 92h84l18-18h64" opacity="0.9" />
    <path d="M1044 268h-84l-18 18h-64" opacity="0.9" />
  </g>

  <g fill="#5fe0d2">
    <circle cx="72" cy="92" r="7" />
    <circle cx="238" cy="74" r="7" />
  </g>
  <g fill="#5baeff">
    <circle cx="1044" cy="268" r="7" />
    <circle cx="878" cy="286" r="7" />
  </g>

  <text x="600" y="202" text-anchor="middle" fill="#f2f7ff" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="800" letter-spacing="8">TERMCADE</text>
  <rect x="380" y="234" width="440" height="5" rx="2.5" fill="url(#accent)" />
  <text x="600" y="292" text-anchor="middle" fill="#a9bdd7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="8">TERMINAL ARCADE</text>
</svg>
